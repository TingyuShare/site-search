name: Build & Deploy to Main

on:
  push:
    branches: [dev]
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build (minify)
        run: npm run build

      - name: Save dist files
        run: |
          # Save dist files to a temporary location before switching branches
          tar czf /tmp/dist.tar.gz dist/

      - name: Commit and push to main
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Create orphan main branch (no history)
          git checkout --orphan main
          git rm -rf .
          git clean -fd
          
          # Restore dist files from temporary location
          tar xzf /tmp/dist.tar.gz -C .
          
          # Copy minified files to project root
          cp -r dist/* .
          rm -rf dist /tmp/dist.tar.gz
          
          # Commit and push
          git add -A
          git commit -m "chore: minify static files [ci skip]"
          git push --force origin main
