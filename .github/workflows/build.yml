name: Build & Deploy to Dev

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build (minify)
        run: npm run build

      - name: Copy dist to project root
        run: |
          # Copy dist files to project root (before switching branches)
          rm -rf css js index.html
          cp -r dist/* .

      - name: Commit and push to dev
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Create orphan dev branch (no history)
          git checkout --orphan dev
          git rm -rf .
          git clean -fd
          
          # Copy minified files from dist
          cp -r dist/* .
          rm -rf dist
          
          # Commit and push
          git add -A
          git commit -m "chore: minify static files [ci skip]"
          git push --force origin dev
